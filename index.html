    const INITIAL_STUDENTS = [
      { id: 201, name: "Alex Rivera", register_number: "CS2026-0892", email: "alex.rivera@campusconnect.edu", phone: "+1 (555) 342-9012", department: "Computer Science", year: "3rd Year", status: "Active" },

    const INITIAL_REGISTRATIONS = [
      { id: 301, user_id: 201, user_name: "Alex Rivera", register_number: "CS2026-0892", email: "alex.rivera@campusconnect.edu", department: "Computer Science", event_id: 101, event_name: "AI & Deep Learning Hackathon 2026", registration_date: "2026-09-15 10:30", status: "Approved" },
      { id: 302, user_id: 201, user_name: "Alex Rivera", register_number: "CS2026-0892", email: "alex.rivera@campusconnect.edu", department: "Computer Science", event_id: 102, event_name: "Annual Inter-College Cultural Fest 'Resonance'", registration_date: "2026-09-16 14:20", status: "Registered" },
      { id: 303, user_id: 202, user_name: "Emily Chen", register_number: "EC2026-0412", email: "emily.chen@campusconnect.edu", department: "Electronics", event_id: 101, event_name: "AI & Deep Learning Hackathon 2026", registration_date: "2026-09-16 16:45", status: "Pending" },
      { id: 304, user_id: 203, user_name: "Marcus Vance", register_number: "ME2026-0118", email: "marcus.vance@campusconnect.edu", department: "Mechanical", event_id: 103, event_name: "Cybersecurity & Ethical Hacking Masterclass", registration_date: "2026-09-17 09:15", status: "Registered" }

    const INITIAL_FEEDBACK = [

    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // Auth State
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('cc_current_user');
        return saved ? JSON.parse(saved) : null; // null = unauthenticated, or user object
      });

      // DB Stores
      const [events, setEvents] = useState(() => {
        const s = localStorage.getItem('cc_events');
        return s ? JSON.parse(s) : INITIAL_EVENTS;
      });
      const [categories, setCategories] = useState(() => {
        const s = localStorage.getItem('cc_categories');
        return s ? JSON.parse(s) : INITIAL_CATEGORIES;
      });
      const [venues, setVenues] = useState(() => {
        const s = localStorage.getItem('cc_venues');
        return s ? JSON.parse(s) : INITIAL_VENUES;
      });
      const [students, setStudents] = useState(() => {
        const s = localStorage.getItem('cc_students');
        return s ? JSON.parse(s) : INITIAL_STUDENTS;
      });
      const [registrations, setRegistrations] = useState(() => {
        const s = localStorage.getItem('cc_registrations');
        return s ? JSON.parse(s) : INITIAL_REGISTRATIONS;
      });
      const [feedbacks, setFeedbacks] = useState(() => {
        const s = localStorage.getItem('cc_feedbacks');
        return s ? JSON.parse(s) : INITIAL_FEEDBACK;
      });

      // Navigation & Modals
      const [currentPage, setCurrentPage] = useState('landing'); // landing, login, register, student-dashboard, browse-events, event-details, my-registrations, calendar, feedback, profile, admin-dashboard, admin-events, admin-registrations, admin-students, admin-categories, admin-venues, admin-feedback
      const [selectedEventId, setSelectedEventId] = useState(null);
      const [toast, setToast] = useState(null);
      const [confirmModal, setConfirmModal] = useState(null); // { title, message, onConfirm }

      // Persist state changes
      useEffect(() => { localStorage.setItem('cc_events', JSON.stringify(events)); }, [events]);
      useEffect(() => { localStorage.setItem('cc_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('cc_venues', JSON.stringify(venues)); }, [venues]);
      useEffect(() => { localStorage.setItem('cc_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('cc_registrations', JSON.stringify(registrations)); }, [registrations]);
      useEffect(() => { localStorage.setItem('cc_feedbacks', JSON.stringify(feedbacks)); }, [feedbacks]);
      useEffect(() => { localStorage.setItem('cc_current_user', JSON.stringify(currentUser)); }, [currentUser]);

      // Refresh icons on state change
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Auth actions
      const handleLogin = (userObj) => {
        setCurrentUser(userObj);
        showToast(`Welcome back, ${userObj.name}!`, 'success');
        if (userObj.role === 'ADMIN') setCurrentPage('admin-dashboard');
        else setCurrentPage('student-dashboard');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setCurrentPage('landing');
        showToast('Logged out successfully', 'info');
      };

      // Navigation handler
      const navigateTo = (page, eventId = null) => {
        if (eventId) setSelectedEventId(eventId);
        setCurrentPage(page);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Quick Role Swapper for Demo
      const switchDemoUser = (role) => {
        if (role === 'ADMIN') {
          handleLogin({
            id: 1,
            name: "Dr. Sarah Jenkins",
            email: "admin@campusconnect.edu",
            role: "ADMIN",
            department: "Dean of Student Affairs",
            year: "Faculty"
          });
        } else {
          handleLogin(students[0]);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans">
          {/* Top Demo Bar */}
          <div className="bg-slate-900 text-slate-300 text-xs py-1.5 px-4 flex flex-wrap items-center justify-between border-b border-slate-800">
            <div className="flex items-center space-x-2">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="font-medium text-white">CampusConnect Academic SOP Demo Environment</span>
              <span className="hidden md:inline text-slate-400">| Full-Stack Architecture Ready</span>
            </div>
            <div className="flex items-center space-x-3 mt-1 sm:mt-0">
              <span className="text-slate-400 font-medium">Quick Switch:</span>
              <button onClick={() => switchDemoUser('ADMIN')} className="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium transition">
                Admin Role
              </button>
              <button onClick={() => switchDemoUser('STUDENT')} className="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 text-white rounded font-medium transition">
                Student Role
              </button>
            </div>
          </div>

          {/* Navigation Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => navigateTo(currentUser ? (currentUser.role === 'ADMIN' ? 'admin-dashboard' : 'student-dashboard') : 'landing')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-bold shadow-md shadow-emerald-500/20">
                  <i data-lucide="graduation-cap" className="w-6 h-6"></i>
                </div>
                <div>
                  <span className="text-xl font-bold bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">CampusConnect</span>
                  <span className="block text-[10px] tracking-wider uppercase font-semibold text-emerald-600">College Event Portal</span>
                </div>
              </div>

              {/* Header Right */}
              <div className="flex items-center space-x-4">
                {currentUser ? (
                  <div className="flex items-center space-x-3">
                    <span className="hidden sm:inline-block px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                      {currentUser.role}
                    </span>
                    <div className="text-right hidden sm:block">
                      <div className="text-sm font-semibold text-slate-900">{currentUser.name}</div>
                      <div className="text-xs text-slate-500">{currentUser.email}</div>
                    </div>
                    <button 
                      onClick={() => navigateTo(currentUser.role === 'ADMIN' ? 'admin-dashboard' : 'student-dashboard')}
                      className="px-3 py-1.5 text-xs font-medium text-slate-700 hover:text-emerald-600 bg-slate-100 hover:bg-emerald-50 rounded-lg transition"
                    >
                      Dashboard
                    </button>
                    <button 
                      onClick={handleLogout}
                      className="px-3 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg transition"
                    >
                      Logout
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center space-x-2">
                    <button onClick={() => navigateTo('browse-events')} className="px-3 py-2 text-sm font-medium text-slate-600 hover:text-emerald-600 transition">
                      Explore Events
                    </button>
                    <button onClick={() => navigateTo('login')} className="px-4 py-2 text-sm font-medium text-slate-700 hover:text-emerald-600 transition">
                      Login
                    </button>
                    <button onClick={() => navigateTo('register')} className="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg shadow-sm shadow-emerald-600/30 transition">
                      Register
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg border flex items-center space-x-3 transition-all transform animate-bounce ${
              toast.type === 'error' ? 'bg-red-900 text-white border-red-700' : 
              toast.type === 'info' ? 'bg-slate-800 text-white border-slate-700' :
              'bg-emerald-800 text-white border-emerald-600'
            }`}>
              <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-5 h-5"></i>
              <span className="text-sm font-medium">{toast.message}</span>
            </div>
          )}

          {/* Main Dynamic View */}
          <main className="flex-1">
            {currentPage === 'landing' && <LandingView navigateTo={navigateTo} events={events} categories={categories} />}
            {currentPage === 'login' && <LoginView onLogin={handleLogin} navigateTo={navigateTo} showToast={showToast} />}
            {currentPage === 'register' && <RegisterView setStudents={setStudents} navigateTo={navigateTo} showToast={showToast} />}
            
            {/* Student Views */}
            {currentPage === 'student-dashboard' && <StudentDashboardView user={currentUser} events={events} registrations={registrations} navigateTo={navigateTo} />}
            {currentPage === 'browse-events' && <BrowseEventsView events={events} categories={categories} venues={venues} registrations={registrations} currentUser={currentUser} navigateTo={navigateTo} setEvents={setEvents} setRegistrations={setRegistrations} showToast={showToast} />}
            {currentPage === 'event-details' && <EventDetailsView eventId={selectedEventId} events={events} categories={categories} venues={venues} registrations={registrations} feedbacks={feedbacks} currentUser={currentUser} navigateTo={navigateTo} setRegistrations={setRegistrations} setFeedbacks={setFeedbacks} showToast={showToast} />}
            {currentPage === 'my-registrations' && <MyRegistrationsView currentUser={currentUser} registrations={registrations} setRegistrations={setRegistrations} events={events} navigateTo={navigateTo} showToast={showToast} />}
            {currentPage === 'calendar' && <StudentCalendarView events={events} registrations={registrations} currentUser={currentUser} navigateTo={navigateTo} />}
            {currentPage === 'feedback' && <FeedbackView currentUser={currentUser} registrations={registrations} feedbacks={feedbacks} setFeedbacks={setFeedbacks} events={events} showToast={showToast} />}
            {currentPage === 'profile' && <ProfileView currentUser={currentUser} setCurrentUser={setCurrentUser} showToast={showToast} />}

            {/* Admin Views */}
            {currentPage === 'admin-dashboard' && <AdminDashboardView events={events} registrations={registrations} students={students} categories={categories} navigateTo={navigateTo} setRegistrations={setRegistrations} showToast={showToast} />}
            {currentPage === 'admin-events' && <AdminEventsView events={events} setEvents={setEvents} categories={categories} venues={venues} registrations={registrations} navigateTo={navigateTo} showToast={showToast} setConfirmModal={setConfirmModal} />}
            {currentPage === 'admin-registrations' && <AdminRegistrationsView registrations={registrations} setRegistrations={setRegistrations} events={events} students={students} showToast={showToast} setConfirmModal={setConfirmModal} />}
            {currentPage === 'admin-students' && <AdminStudentsView students={students} setStudents={setStudents} showToast={showToast} setConfirmModal={setConfirmModal} />}
            {currentPage === 'admin-categories' && <AdminCategoriesView categories={categories} setCategories={setCategories} events={events} showToast={showToast} setConfirmModal={setConfirmModal} />}
            {currentPage === 'admin-venues' && <AdminVenuesView venues={venues} setVenues={setVenues} events={events} showToast={showToast} setConfirmModal={setConfirmModal} />}
            {currentPage === 'admin-feedback' && <AdminFeedbackView feedbacks={feedbacks} events={events} showToast={showToast} setConfirmModal={setConfirmModal} setFeedbacks={setFeedbacks} />}
          </main>

          {/* Confirmation Modal */}
          {confirmModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-200">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <h3 className="text-lg font-bold text-center text-slate-900 mb-2">{confirmModal.title}</h3>
                <p className="text-sm text-slate-600 text-center mb-6">{confirmModal.message}</p>
                <div className="flex space-x-3">
                  <button onClick={() => setConfirmModal(null)} className="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition">
                    Cancel
                  </button>
                  <button onClick={() => { confirmModal.onConfirm(); setConfirmModal(null); }} className="flex-1 py-2.5 px-4 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-semibold transition shadow-md shadow-red-600/30">
                    Confirm Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 py-12 mt-16">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8">
              <div className="space-y-4">
                <div className="flex items-center space-x-2">
                  <div className="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-white font-bold">
                    <i data-lucide="graduation-cap" className="w-5 h-5"></i>
                  </div>
                  <span className="text-lg font-bold text-white">CampusConnect</span>
                </div>
                <p className="text-sm text-slate-400 leading-relaxed">
                  One platform to discover college events, register instantly, and stay connected with campus activities.
                </p>
              </div>
              <div>
                <h4 className="text-sm font-semibold text-white uppercase tracking-wider mb-4">Quick Links</h4>
                <ul className="space-y-2 text-sm">
                  <li><button onClick={() => navigateTo('browse-events')} className="hover:text-emerald-400 transition">Browse Events</button></li>
                  <li><button onClick={() => navigateTo('login')} className="hover:text-emerald-400 transition">Student Login</button></li>
                  <li><button onClick={() => navigateTo('register')} className="hover:text-emerald-400 transition">Registration</button></li>
                </ul>
              </div>
              <div>
                <h4 className="text-sm font-semibold text-white uppercase tracking-wider mb-4">Categories</h4>
                <ul className="space-y-2 text-sm">
                  <li className="hover:text-emerald-400 cursor-pointer">Technical & Hackathons</li>
                  <li className="hover:text-emerald-400 cursor-pointer">Cultural Fests</li>
                  <li className="hover:text-emerald-400 cursor-pointer">Sports Tournaments</li>
                  <li className="hover:text-emerald-400 cursor-pointer">Workshops & Seminars</li>
                </ul>
              </div>
              <div>
                <h4 className="text-sm font-semibold text-white uppercase tracking-wider mb-4">Contact & Support</h4>
                <p className="text-sm text-slate-400">Campus Events Office, Student Center, Block A</p>
                <p className="text-sm text-slate-400 mt-2">Email: events@campusconnect.edu</p>
                <p className="text-sm text-slate-400">Helpline: +1 (800) 555-0199</p>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 mt-8 border-t border-slate-800 text-xs text-center text-slate-500">
              © 2026 CampusConnect – College Event Management System. All rights reserved. Academic Project SOP Standard.
            </div>
          </footer>
        </div>
      );

    // --- BROWSE EVENTS VIEW ---

          return matchSearch && matchCategory && matchStatus;

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-8 flex flex-col md:flex-row gap-4">

                onChange={e => setSearchQuery(e.target.value)}

              />

            <div className="flex gap-3">
              <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)} className="px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                <option value="All">All Categories</option>
                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <select value={selectedStatus} onChange={e => setSelectedStatus(e.target.value)} className="px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                <option value="All">All Statuses</option>
                <option value="Published">Published</option>
                <option value="Ongoing">Ongoing</option>
                <option value="Completed">Completed</option>

          ) : (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {filteredEvents.map(ev => {
                const isReg = registrations.some(r => r.event_id === ev.id && (r.user_id === currentUser?.id || r.email === currentUser?.email) && r.status !== 'Cancelled');
                return (
                  <div key={ev.id} className="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">

                      <div className="relative h-44 overflow-hidden bg-slate-100">

                          <div>Seats available: <b>{ev.max_participants - registrations.filter(r => r.event_id === ev.id).length}</b> / {ev.max_participants}</div>

                      </div>
                    </div>

                    <div className="p-5 pt-0">
                      <button onClick={() => navigateTo('event-details', ev.id)} className={`w-full py-2.5 rounded-xl text-xs font-semibold transition ${isReg ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`}>

    // --- EVENT DETAILS VIEW ---
    function EventDetailsView({ eventId, events, categories, venues, registrations, feedbacks, currentUser, navigateTo, setRegistrations, setFeedbacks, showToast }) {
      const ev = events.find(e => e.id === eventId) || events[0];
      const isReg = registrations.some(r => r.event_id === ev.id && (r.user_id === currentUser?.id || r.email === currentUser?.email) && r.status !== 'Cancelled');
      const category = categories.find(c => c.id === ev.category_id);
      const venue = venues.find(v => v.id === ev.venue_id);
      const eventRegs = registrations.filter(r => r.event_id === ev.id && r.status !== 'Cancelled');
      const seatsLeft = ev.max_participants - eventRegs.length;

      const handleRegister = () => {
        if (!currentUser) {
          showToast('Please login to register for events.', 'error');
          navigateTo('login');
          return;
        }
        const newReg = {
          id: Date.now(),
          user_id: currentUser.id,
          user_name: currentUser.name,
          register_number: currentUser.register_number || 'REG-2026',
          email: currentUser.email,
          department: currentUser.department || 'General',
          event_id: ev.id,
          event_name: ev.event_name,
          registration_date: new Date().toISOString().replace('T', ' ').substring(0, 16),
          status: 'Registered'
        };
        setRegistrations(prev => [newReg, ...prev]);
        showToast(`Successfully registered for ${ev.event_name}!`, 'success');
      };

      const handleCancelReg = () => {
        setRegistrations(prev => prev.map(r => (r.event_id === ev.id && (r.user_id === currentUser?.id || r.email === currentUser?.email)) ? {...r, status: 'Cancelled'} : r));
        showToast('Registration cancelled.', 'info');
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <button onClick={() => navigateTo('browse-events')} className="text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center space-x-1 mb-4">
            <i data-lucide="arrow-left" className="w-4 h-4"></i>
            <span>Back to Browse Events</span>
          </button>

          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <div className="h-72 w-full relative">
              <img src={ev.poster} className="w-full h-full object-cover" />
              <span className="absolute top-4 left-4 px-3 py-1 bg-white/90 font-bold text-xs rounded-full text-emerald-800">
                {category?.name}
              </span>
            </div>

            <div className="p-8">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                <div>
                  <h1 className="text-3xl font-extrabold text-slate-900">{ev.event_name}</h1>
                  <p className="text-sm text-slate-500 mt-1">Organized by <span className="font-semibold text-slate-700">{ev.organizer}</span></p>
                </div>

                <div>
                  {isReg ? (
                    <button onClick={handleCancelReg} className="px-6 py-3 bg-red-50 text-red-600 hover:bg-red-100 font-semibold rounded-xl text-sm border border-red-200 transition">
                      Cancel Registration
                    </button>
                  ) : (
                    <button 
                      onClick={handleRegister}
                      disabled={seatsLeft <= 0}
                      className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-semibold rounded-xl text-sm shadow-md transition"
                    >
                      {seatsLeft <= 0 ? 'Event Full' : 'Register Now'}
                    </button>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 py-6 border-b border-slate-100 text-xs">
                <div>
                  <span className="text-slate-400 block">Date & Time</span>
                  <span className="font-bold text-slate-800 text-sm">{ev.date} • {ev.start_time}</span>
                </div>
                <div>
                  <span className="text-slate-400 block">Venue Location</span>
                  <span className="font-bold text-slate-800 text-sm">{venue?.name}</span>
                </div>
                <div>
                  <span className="text-slate-400 block">Capacity Seats</span>
                  <span className="font-bold text-slate-800 text-sm">{seatsLeft} seats left</span>
                </div>
                <div>
                  <span className="text-slate-400 block">Registration Deadline</span>
                  <span className="font-bold text-slate-800 text-sm">{ev.registration_deadline.replace('T', ' ')}</span>
                </div>
              </div>

              <div className="py-6">
                <h3 className="text-lg font-bold text-slate-900 mb-2">Event Overview</h3>
                <p className="text-slate-600 text-sm leading-relaxed">{ev.description}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- FEEDBACK VIEW ---
    function FeedbackView({ currentUser, registrations, feedbacks, setFeedbacks, events, showToast }) {
      const [selectedEventId, setSelectedEventId] = useState('');
      const [rating, setRating] = useState(5);
      const [comment, setComment] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!selectedEventId || !comment) {
          showToast('Please complete all feedback fields.', 'error');
          return;
        }
        const ev = events.find(e => e.id === parseInt(selectedEventId));
        const newFb = {
          id: Date.now(),
          user_id: currentUser.id,
          user_name: currentUser.name,
          event_id: ev.id,
          event_name: ev.event_name,
          rating: parseInt(rating),
          comment,
          date: new Date().toISOString().split('T')[0]
        };
        setFeedbacks(prev => [newFb, ...prev]);
        setComment('');
        showToast('Thank you! Feedback submitted successfully.', 'success');
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-900 mb-6">Event Feedback & Reviews</h1>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h3 className="font-bold text-slate-900 mb-4">Submit New Event Feedback</h3>
              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Select Event Attended</label>
                  <select value={selectedEventId} onChange={e => setSelectedEventId(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-xl bg-white">
                    <option value="">-- Choose Event --</option>
                    {events.map(e => <option key={e.id} value={e.id}>{e.event_name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Rating (1 to 5 Stars)</label>
                  <select value={rating} onChange={e => setRating(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-xl bg-white">
                    <option value="5">⭐⭐⭐⭐⭐ 5 - Excellent</option>
                    <option value="4">⭐⭐⭐⭐ 4 - Very Good</option>
                    <option value="3">⭐⭐⭐ 3 - Average</option>
                    <option value="2">⭐⭐ 2 - Poor</option>
                    <option value="1">⭐ 1 - Very Poor</option>
                  </select>
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Your Comments & Suggestions</label>
                  <textarea rows="4" value={comment} onChange={e => setComment(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-xl" placeholder="Share your experience..."></textarea>
                </div>
                <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition">
                  Submit Feedback
                </button>
              </form>
            </div>

            <div className="space-y-4">
              <h3 className="font-bold text-slate-900">Your Submitted Feedback</h3>
              {feedbacks.map(fb => (
                <div key={fb.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-xs">
                  <div className="flex justify-between font-bold text-slate-900 mb-1">
                    <span>{fb.event_name}</span>
                    <span className="text-amber-500">{'★'.repeat(fb.rating)}</span>
                  </div>
                  <p className="text-slate-600 mb-2">{fb.comment}</p>
                  <span className="text-slate-400 text-[10px]">{fb.date}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 text-center">
              <div className="text-2xl font-extrabold text-purple-600">{categories.length}</div>
              <div className="text-[10px] font-bold text-slate-400 uppercase">Categories</div>
            </div>
          </div>

          {/* Charts Row */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h3 className="text-sm font-bold text-slate-900 mb-4">Registration Velocity Over Time</h3>
              <div className="h-44 flex items-end justify-between space-x-2 pt-4 px-2">
                {[35, 50, 75, 110, 95, 140, 180].map((h, idx) => (
                  <div key={idx} className="flex-1 flex flex-col items-center gap-1">
                    <div className="w-full bg-emerald-500 rounded-t-lg transition-all" style={{ height: `${h / 2}px` }}></div>
                    <span className="text-[10px] text-slate-400">Day {idx + 1}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h3 className="text-sm font-bold text-slate-900 mb-4">Events Distribution by Category</h3>
              <div className="space-y-3 text-xs">
                {categories.map(cat => {
                  const count = events.filter(e => e.category_id === cat.id).length;
                  const pct = (count / Math.max(1, events.length)) * 100;
                  return (
                    <div key={cat.id}>
                      <div className="flex justify-between font-semibold text-slate-700 mb-1">
                        <span>{cat.name}</span>
                        <span>{count} events</span>
                      </div>
                      <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div className="h-full bg-emerald-600 rounded-full" style={{ width: `${pct}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- ADMIN EVENTS CRUD VIEW ---
    function AdminEventsView({ events, setEvents, categories, venues, navigateTo, showToast, setConfirmModal }) {
      const [showModal, setShowModal] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);

      const [formData, setFormData] = useState({
        event_name: '',
        description: '',
        category_id: 1,
        date: '2026-10-25',
        start_time: '10:00',
        end_time: '17:00',
        venue_id: 1,
        organizer: 'Campus Board',
        max_participants: 100,
        registration_deadline: '2026-10-24T23:59',
        poster: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1200&q=80',
        status: 'Published'
      });

      const handleSave = (e) => {
        e.preventDefault();
        if (editingEvent) {
          setEvents(prev => prev.map(ev => ev.id === editingEvent.id ? { ...ev, ...formData } : ev));
          showToast('Event updated successfully!', 'success');
        } else {
          const newEv = { id: Date.now(), ...formData };
          setEvents(prev => [newEv, ...prev]);
          showToast('New event created!', 'success');
        }
        setShowModal(false);
      };

      const handleDelete = (id) => {
        setConfirmModal({
          title: "Delete Event",
          message: "Are you sure you want to delete this event? All student registrations will be removed.",
          onConfirm: () => {
            setEvents(prev => prev.filter(e => e.id !== id));
            showToast('Event deleted.', 'info');
          }
        });
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <div className="flex justify-between items-center mb-6">
            <h1 className="text-2xl font-bold text-slate-900">Event Management</h1>
            <button onClick={() => { setEditingEvent(null); setShowModal(true); }} className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow">
              + Create Event
            </button>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase">
                  <th className="p-4">Event Name</th>
                  <th className="p-4">Category</th>
                  <th className="p-4">Date</th>
                  <th className="p-4">Venue</th>
                  <th className="p-4">Status</th>
                  <th className="p-4">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {events.map(ev => (
                  <tr key={ev.id} className="hover:bg-slate-50">
                    <td className="p-4 font-bold text-slate-900">{ev.event_name}</td>
                    <td className="p-4">{categories.find(c => c.id === ev.category_id)?.name}</td>
                    <td className="p-4">{ev.date}</td>
                    <td className="p-4">{venues.find(v => v.id === ev.venue_id)?.name}</td>
                    <td className="p-4">
                      <span className="px-2 py-1 font-bold rounded-full text-[10px] bg-emerald-100 text-emerald-800">
                        {ev.status}
                      </span>
                    </td>
                    <td className="p-4 space-x-2">
                      <button onClick={() => { setEditingEvent(ev); setFormData(ev); setShowModal(true); }} className="text-emerald-600 font-semibold hover:underline">Edit</button>
                      <button onClick={() => handleDelete(ev.id)} className="text-red-600 font-semibold hover:underline">Delete</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Modal Form */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl">
                <h3 className="text-lg font-bold mb-4 text-slate-900">{editingEvent ? 'Edit Event' : 'Create New Event'}</h3>
                <form onSubmit={handleSave} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold mb-1">Event Name</label>
                    <input type="text" value={formData.event_name} onChange={e => setFormData({...formData, event_name: e.target.value})} required className="w-full p-2 border rounded-xl" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Description</label>
                    <textarea value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} required className="w-full p-2 border rounded-xl" rows="3"></textarea>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold mb-1">Date</label>
                      <input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} required className="w-full p-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Max Capacity</label>
                      <input type="number" value={formData.max_participants} onChange={e => setFormData({...formData, max_participants: parseInt(e.target.value)})} required className="w-full p-2 border rounded-xl" />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-4">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-semibold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-xl font-semibold">Save Event</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- ADMIN REGISTRATIONS VIEW ---
    function AdminRegistrationsView({ registrations, setRegistrations, events, showToast }) {
      const handleStatusChange = (id, newStatus) => {
        setRegistrations(prev => prev.map(r => r.id === id ? { ...r, status: newStatus } : r));
        showToast(`Registration status updated to ${newStatus}`, 'success');
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-900 mb-6">Student Registrations Management</h1>
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase">
                  <th className="p-4">Reg ID</th>
                  <th className="p-4">Student Name</th>
                  <th className="p-4">Register No</th>
                  <th className="p-4">Event</th>
                  <th className="p-4">Status</th>
                  <th className="p-4">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {registrations.map(r => (
                  <tr key={r.id} className="hover:bg-slate-50">
                    <td className="p-4 font-mono font-bold">#REG-{r.id}</td>
                    <td className="p-4 font-bold">{r.user_name}</td>
                    <td className="p-4 font-mono text-slate-500">{r.register_number}</td>
                    <td className="p-4">{r.event_name}</td>
                    <td className="p-4">
                      <span className={`px-2.5 py-1 font-bold rounded-full text-[10px] ${
                        r.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' :
                        r.status === 'Rejected' ? 'bg-red-100 text-red-800' :
                        'bg-blue-100 text-blue-800'
                      }`}>
                        {r.status}
                      </span>
                    </td>
                    <td className="p-4 space-x-2">
                      <button onClick={() => handleStatusChange(r.id, 'Approved')} className="text-emerald-600 font-semibold hover:underline">Approve</button>
                      <button onClick={() => handleStatusChange(r.id, 'Rejected')} className="text-red-600 font-semibold hover:underline">Reject</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- ADMIN STUDENTS CRUD VIEW ---
    function AdminStudentsView({ students, setStudents, showToast, setConfirmModal }) {
      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-900 mb-6">Student Roster Management</h1>
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase">
                  <th className="p-4">Name</th>
                  <th className="p-4">Register Number</th>
                  <th className="p-4">Email</th>
                  <th className="p-4">Department</th>
                  <th className="p-4">Year</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {students.map(s => (
                  <tr key={s.id} className="hover:bg-slate-50">
                    <td className="p-4 font-bold">{s.name}</td>
                    <td className="p-4 font-mono">{s.register_number}</td>
                    <td className="p-4 text-slate-500">{s.email}</td>
                    <td className="p-4">{s.department}</td>
                    <td className="p-4">{s.year}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- ADMIN CATEGORIES VIEW ---
    function AdminCategoriesView({ categories, setCategories, showToast }) {
      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-900 mb-6">Event Categories</h1>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {categories.map(c => (
              <div key={c.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h3 className="font-bold text-slate-900 text-base">{c.name}</h3>
                <p className="text-xs text-slate-500 mt-1">{c.description}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- ADMIN VENUES VIEW ---
    function AdminVenuesView({ venues, setVenues, showToast }) {
      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-900 mb-6">Campus Venues</h1>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {venues.map(v => (
              <div key={v.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <h3 className="font-bold text-slate-900 text-base">{v.name}</h3>
                  <p className="text-xs text-slate-500 mt-0.5">{v.location} • Capacity: {v.capacity}</p>
                </div>
                <span className={`px-2.5 py-1 text-[10px] font-bold rounded-full ${v.availability ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                  {v.availability ? 'Available' : 'Booked'}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- ADMIN FEEDBACK VIEW ---
    function AdminFeedbackView({ feedbacks }) {
      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-900 mb-6">All Student Feedback</h1>
          <div className="space-y-4">
            {feedbacks.map(fb => (
              <div key={fb.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-xs">
                <div className="flex justify-between font-bold text-slate-900 mb-1">
                  <span>{fb.event_name} - <span className="text-slate-500">{fb.user_name}</span></span>
                  <span className="text-amber-500">{'★'.repeat(fb.rating)}</span>
                </div>
                <p className="text-slate-600">{fb.comment}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Render React Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
